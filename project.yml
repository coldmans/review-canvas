name: ReviewCanvas

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.4"

packages:
  ReviewCanvasCore:
    path: Packages/ReviewCanvasCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""

targetTemplates:
  ReviewCanvasApp:
    type: application
    sources:
      - path: App/Shared
      - path: Resources
        buildPhase: resources
      - path: node_modules/mermaid/dist/mermaid.min.js
        buildPhase: resources
      - path: node_modules/mermaid/LICENSE
        buildPhase: resources
    dependencies:
      - package: ReviewCanvasCore
    settings:
      base:
        PRODUCT_NAME: Review Canvas
        PRODUCT_MODULE_NAME: ReviewCanvasApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coldmans.review-canvas
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"

targets:
  ReviewCanvas-macOS:
    templates:
      - ReviewCanvasApp
    platform: macOS
    sources:
      - path: App/macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coldmans.review-canvas.macos
        INFOPLIST_FILE: App/macOS/Info.plist
        CODE_SIGN_IDENTITY: "-"

  ReviewCanvas-iPadOS:
    templates:
      - ReviewCanvasApp
    platform: iOS
    sources:
      - path: App/iPadOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coldmans.review-canvas.ipados
        INFOPLIST_FILE: App/iPadOS/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: "NO"

  ReviewCanvasUITests-iPadOS:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: ReviewCanvas-iPadOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coldmans.review-canvas.ipados-uitests
        TARGETED_DEVICE_FAMILY: "2"

  ReviewCanvasTests-macOS:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: ReviewCanvas-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.coldmans.review-canvas.macos-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Review Canvas.app/Contents/MacOS/Review Canvas"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  ReviewCanvas-macOS:
    build:
      targets:
        ReviewCanvas-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReviewCanvasTests-macOS

  ReviewCanvas-iPadOS:
    build:
      targets:
        ReviewCanvas-iPadOS: all
        ReviewCanvasUITests-iPadOS: [test]
    test:
      config: Debug
      targets:
        - ReviewCanvasUITests-iPadOS
